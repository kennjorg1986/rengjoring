<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rengjøring i dag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0E9;
    --ink:#1A211E;
    --ink-soft:#5C6B62;
    --teal:#1D6E68;
    --teal-deep:#0E3A3B;
    --brass:#C79A3D;
    --done:#3F6B4C;
    --rust:#A6432C;
    --line:#D8D9CC;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:88px;
    -webkit-font-smoothing:antialiased;
  }
  *:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  header{
    background:var(--teal-deep);
    background-image:
      radial-gradient(circle at 92% -10%, rgba(199,154,61,0.16), transparent 55%);
    color:var(--paper);
    padding:24px 20px 20px;
    position:relative;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#9FC3BE;
    margin:0 0 6px;
  }
  header h1{
    font-family:'Archivo Expanded', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:0.01em;
    margin:0 0 14px;
    text-transform:uppercase;
    line-height:1;
  }
  .day-nav{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .day-nav button{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.28);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.04em;
    padding:7px 12px;
    cursor:pointer;
    border-radius:3px;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .day-nav button:hover{background:rgba(255,255,255,0.18); border-color:rgba(255,255,255,0.45);}
  .day-nav button.report-btn{
    background:var(--brass);
    color:var(--teal-deep);
    border-color:var(--brass);
    margin-left:auto;
    font-weight:700;
  }
  .day-nav button.report-btn:hover{filter:brightness(1.08);}
  .day-nav .date{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:#BFD9D3;
    padding:0 2px;
  }
  header .count{
    position:absolute;
    right:20px;
    top:22px;
    background:var(--brass);
    color:var(--teal-deep);
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.03em;
    padding:5px 11px;
    border-radius:999px;
  }

  #gate{
    max-width:340px;
    margin:100px auto;
    padding:28px;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(14,58,59,0.06), 0 10px 30px rgba(14,58,59,0.08);
    text-align:center;
  }
  #gate p{font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;}
  #gate input{
    width:100%;
    padding:11px 12px;
    font-size:16px;
    border:1px solid var(--line);
    margin:14px 0;
    font-family:inherit;
  }
  #gate button, .refresh-btn{
    background:var(--teal-deep);
    color:#fff;
    border:none;
    padding:11px 20px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.03em;
  }
  #gate p.err{color:var(--rust);font-size:13px;font-family:'IBM Plex Sans';text-transform:none;letter-spacing:0;font-weight:400;}

  main{max-width:640px;margin:0 auto;padding:24px 16px 4px;}

  .task{
    background:var(--card);
    border:1px solid var(--line);
    margin-bottom:22px;
    position:relative;
    display:flex;
    box-shadow:0 1px 2px rgba(14,58,59,0.04), 0 6px 18px rgba(14,58,59,0.07);
  }
  .stub{
    width:30px;
    flex:0 0 30px;
    background:repeating-linear-gradient(
      to bottom, var(--teal) 0 7px, transparent 7px 14px
    );
    background-color:var(--teal-deep);
    position:relative;
    border-right:2px dashed var(--card);
  }
  .stub::before, .stub::after{
    content:"";
    position:absolute;
    left:50%;
    width:13px;height:13px;
    background:var(--paper);
    border-radius:50%;
    transform:translateX(-50%);
  }
  .stub::before{top:-6.5px;}
  .stub::after{bottom:-6.5px;}
  .task.done .stub{background-color:var(--done);}

  .task-body{padding:18px 18px 16px;flex:1;min-width:0;}

  .thumb{
    width:100%;
    height:152px;
    object-fit:cover;
    display:block;
    margin-bottom:14px;
    background:var(--line);
  }

  .task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:2px;}
  .prop-name{
    font-family:'Archivo Expanded', sans-serif;
    font-weight:800;
    font-size:20px;
    text-transform:uppercase;
    letter-spacing:0.005em;
    line-height:1.15;
  }

  .stamp{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.07em;
    text-transform:uppercase;
    padding:4px 9px;
    border:2px solid currentColor;
    border-radius:2px;
    transform:rotate(-3deg);
    mix-blend-mode:multiply;
    white-space:nowrap;
    flex-shrink:0;
  }
  .stamp.paid{color:var(--done);}
  .stamp.unpaid{color:var(--rust);}
  .stamp.self{color:var(--ink-soft);}

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:14px;
    padding:9px 0;
    border-top:1px solid var(--line);
    margin-top:8px;
  }
  .row .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .row .value{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
    text-align:right;
  }

  .arrivals{margin-top:8px;}
  .arrival-line{
    font-size:13px;
    color:var(--teal-deep);
    background:#EAF0EC;
    padding:8px 10px;
    margin-top:6px;
    border-left:3px solid var(--teal);
  }

  .cleaner-line{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:12px;
  }
  .cleaner-line b{color:var(--ink); font-weight:600;}

  .section{
    margin-top:16px;
    padding-top:16px;
    border-top:2px dashed var(--line);
  }
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin-bottom:8px;
  }

  .note-box textarea{
    width:100%;
    min-height:60px;
    padding:9px 10px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    border:1px solid var(--line);
    resize:vertical;
    background:var(--paper);
  }
  .ghost-btn{
    margin-top:8px;
    background:transparent;
    color:var(--teal-deep);
    border:1px solid var(--teal-deep);
    padding:8px 14px;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.03em;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .ghost-btn:hover{background:var(--teal-deep); color:#fff;}
  .note-saved-msg{
    font-size:12px;
    color:var(--done);
    margin-left:10px;
    display:none;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
  }

  .photo-gallery{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:10px;
  }
  .photo-item{position:relative; display:inline-block;}
  .photo-thumb{
    width:64px;
    height:64px;
    object-fit:cover;
    border:1px solid var(--line);
    display:block;
  }
  .photo-delete-btn{
    position:absolute;
    top:-7px;
    right:-7px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--rust);
    color:#fff;
    border:2px solid var(--card);
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .photo-btn-row{display:flex; gap:8px; flex-wrap:wrap;}

  .payment-checkbox{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    margin-bottom:10px;
    color:var(--ink);
  }
  .payment-checkbox input{width:16px;height:16px; accent-color:var(--teal-deep);}
  .payment-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .payment-row input[type="number"]{
    width:88px;
    padding:8px 9px;
    border:1px solid var(--line);
    font-size:14px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    background:var(--paper);
  }

  .done-btn{
    margin-top:18px;
    width:100%;
    padding:13px;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border:none;
    background:var(--teal-deep);
    color:#fff;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    transition:background 0.15s ease;
  }
  .done-btn:hover{background:var(--teal);}
  .task.done .done-btn{background:var(--done);}
  .task.done .done-btn:hover{filter:brightness(1.08);}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:64px 24px;
    background:var(--card);
    border:1px solid var(--line);
  }
  .empty .empty-icon{
    font-size:28px;
    display:block;
    margin-bottom:10px;
  }
  .empty .empty-title{
    font-family:'Archivo Expanded', sans-serif;
    font-weight:800;
    font-size:16px;
    text-transform:uppercase;
    color:var(--ink);
    margin-bottom:4px;
  }
  .empty .empty-sub{font-size:13px;}

  footer.bar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:12px 16px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
  }
  .auto-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  #report-view .day-nav{
    background:var(--teal-deep);
    padding:14px 16px;
    margin:-24px -16px 20px;
  }
  .report-summary{
    background:var(--card);
    border:1px solid var(--line);
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 1px 2px rgba(14,58,59,0.04), 0 6px 18px rgba(14,58,59,0.07);
  }
  .report-summary .prop-name{margin-bottom:4px;}
  .report-summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .report-stat{
    background:var(--paper);
    padding:12px 14px;
    border-left:3px solid var(--teal);
  }
  .report-stat.paid{border-left-color:var(--done);}
  .report-stat.unpaid{border-left-color:var(--rust);}
  .report-stat.self{border-left-color:var(--line);}
  .report-stat .num{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:19px;
    display:block;
  }
  .report-stat .lbl{
    font-size:11px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }
  .report-entry{
    background:var(--card);
    border:1px solid var(--line);
    padding:13px 16px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .report-entry .re-left{min-width:0;}
  .report-entry .re-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.03em;
  }
  .report-entry .re-name{
    font-weight:700;
    font-size:15px;
    margin-top:2px;
  }
  .report-empty{
    text-align:center;
    color:var(--ink-soft);
    padding:48px 20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }
</style>
</head>
<body>

<div id="gate">
  <p>Skriv inn passord</p>
  <input type="password" id="pw" placeholder="Passord" />
  <button onclick="unlock()">Lås opp</button>
  <p class="err" id="gate-err"></p>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="count" id="count-badge">–</div>
    <p class="eyebrow">Daglig manifest</p>
    <h1>Rengjøring</h1>
    <div class="day-nav">
      <button onclick="changeDay(-1)">‹ Forrige</button>
      <span class="date" id="date-label"></span>
      <button onclick="changeDay(1)">Neste ›</button>
      <button onclick="goToday()">I dag</button>
      <button class="report-btn" onclick="showReport()">Rapport</button>
    </div>
  </header>
  <main id="task-list"></main>

  <main id="report-view" style="display:none;">
    <div class="day-nav">
      <button onclick="changeReportMonth(-1)">‹ Forrige måned</button>
      <span class="date" id="report-month-label"></span>
      <button onclick="changeReportMonth(1)">Neste måned ›</button>
      <button onclick="hideReport()" style="margin-left:auto;">← Tilbake</button>
    </div>
    <div id="report-content"></div>
  </main>

  <footer class="bar">
    <button class="refresh-btn" onclick="load()">Oppdater</button>
    <span class="auto-label">Auto · hvert 3. min</span>
  </footer>
</div>

<script>
const PW_KEY = "rengjoring_pw";
let dayOffset = 0;
let reportMonthOffset = 0;

const CLOUDINARY_CLOUD_NAME = "silizk68";
const CLOUDINARY_UPLOAD_PRESET = "Rengjoring-bilder";

function unlock(){
  const pw = document.getElementById('pw').value;
  localStorage.setItem(PW_KEY, pw);
  load();
}

async function api(path, opts={}){
  const pw = localStorage.getItem(PW_KEY) || "";
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "x-dashboard-password": pw, ...(opts.headers||{}) }
  });
  if(res.status === 401){
    document.getElementById('gate').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate-err').textContent = "Feil passord.";
    throw new Error("unauthorized");
  }
  return res.json();
}

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('nb-NO', { weekday:'long', day:'numeric', month:'long' });
}

function isoDateForOffset(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function changeDay(delta){
  dayOffset += delta;
  load();
}

function goToday(){
  dayOffset = 0;
  load();
}

function renderTask(t){
  const hasArrival = t.nextArrivals && t.nextArrivals.length > 0;
  const arrivalsHtml = hasArrival
    ? t.nextArrivals.map(a => `
        <div class="arrival-line">
          Nye gjester inn ${a.checkinTime ? "kl " + a.checkinTime : "samme dag"} — ${a.guests} gjester
        </div>`).join("")
    : `<div class="arrival-line" style="background:#F0EFE7;border-left-color:var(--line);color:var(--ink-soft);">Ingen innsjekk samme dag</div>`;

  const thumbHtml = t.imageUrl
    ? `<img class="thumb" src="${t.imageUrl}" alt="${t.propertyName}" />`
    : "";

  const photos = t.photos || [];
  const galleryHtml = photos.map(url => `
    <div class="photo-item">
      <a href="${url}" target="_blank"><img class="photo-thumb" src="${url}" /></a>
      <button class="photo-delete-btn" onclick="deletePhoto('${t.key}', '${url.replace(/'/g, "\\'")}')" title="Slett bilde">×</button>
    </div>`).join("");

  let paymentStamp;
  if(t.selfCleaned){
    paymentStamp = `<div class="stamp self">Rengjort selv</div>`;
  } else if(t.paid){
    paymentStamp = `<div class="stamp paid">Betalt · ${t.amount} kr</div>`;
  } else {
    paymentStamp = `<div class="stamp unpaid">Ikke betalt</div>`;
  }

  return `
  <div class="task ${t.done ? 'done' : ''}" id="task-${t.key}">
    <div class="stub"></div>
    <div class="task-body">
      ${thumbHtml}
      <div class="task-top">
        <div class="prop-name">${t.propertyName}</div>
        ${paymentStamp}
      </div>
      <div class="row">
        <span class="label">Utsjekk</span>
        <span class="value">${t.checkoutTime ? t.checkoutTime.slice(0,5) : 'Ukjent'}</span>
      </div>
      <div class="arrivals">${arrivalsHtml}</div>
      <div class="cleaner-line">Ansvarlig: <b>${t.cleaner.name || 'Ikke satt'}</b></div>

      <div class="section note-box">
        <label class="section-label" for="note-${t.key}">Beskjeder</label>
        <textarea id="note-${t.key}" placeholder="F.eks. tidlig innsjekk, sen utsjekk, når leiligheten er klar...">${t.note || ""}</textarea>
        <button class="ghost-btn" onclick="saveNote('${t.key}')">Lagre beskjed</button>
        <span class="note-saved-msg" id="saved-${t.key}">Lagret ✓</span>
      </div>

      <div class="section photo-section">
        <label class="section-label">Bilder — skader, glemte ting o.l.</label>
        <div class="photo-gallery">${galleryHtml}</div>
        <div class="photo-btn-row">
          <label class="ghost-btn" style="margin-top:0; display:inline-block;">
            📷 Ta bilde
            <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="uploadPhoto('${t.key}', this)" />
          </label>
          <label class="ghost-btn" style="margin-top:0; display:inline-block;">
            🖼️ Velg fra galleri
            <input type="file" accept="image/*" style="display:none;" onchange="uploadPhoto('${t.key}', this)" />
          </label>
        </div>
        <span class="note-saved-msg" id="uploading-${t.key}" style="display:none;">Laster opp …</span>
      </div>

      <div class="section payment-box">
        <label class="section-label">Betaling</label>
        <label class="payment-checkbox">
          <input type="checkbox" id="self-${t.key}" ${t.selfCleaned ? 'checked' : ''} onchange="toggleSelfCleaned('${t.key}', this.checked)" />
          Rengjort selv (ingen betaling)
        </label>
        <div class="payment-row" id="payment-row-${t.key}" style="${t.selfCleaned ? 'display:none;' : ''}">
          <input type="number" id="amount-${t.key}" value="${t.amount}" min="0" step="10" />
          <label class="payment-checkbox" style="margin-bottom:0;">
            <input type="checkbox" id="paid-${t.key}" ${t.paid ? 'checked' : ''} />
            Betalt
          </label>
          <button class="ghost-btn" style="margin-top:0;" onclick="savePayment('${t.key}')">Lagre</button>
        </div>
      </div>

      <button class="done-btn" onclick="toggleDone('${t.key}', ${!t.done})">
        ${t.done ? '✓ Rengjort' : 'Merk som rengjort'}
      </button>
    </div>
  </div>`;
}

async function toggleDone(key, done){
  await api(`/api/tasks/${encodeURIComponent(key)}/done`, {
    method: 'POST',
    body: JSON.stringify({ done })
  });
  load();
}

async function saveNote(key){
  const textarea = document.getElementById(`note-${key}`);
  const note = textarea ? textarea.value : "";
  await api(`/api/tasks/${encodeURIComponent(key)}/note`, {
    method: 'POST',
    body: JSON.stringify({ note })
  });
  const msg = document.getElementById(`saved-${key}`);
  if(msg){
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 2000);
  }
}

async function uploadPhoto(key, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const msg = document.getElementById(`uploading-${key}`);
  if(msg) msg.style.display = 'inline';

  try{
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

    const uploadRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: 'POST',
      body: formData
    });
    const uploadData = await uploadRes.json();

    if(!uploadData.secure_url){
      alert('Kunne ikke laste opp bildet. Prøv igjen.');
      return;
    }

    await api(`/api/tasks/${encodeURIComponent(key)}/photos`, {
      method: 'POST',
      body: JSON.stringify({ url: uploadData.secure_url })
    });

    load();
  }catch(e){
    alert('Noe gikk galt under opplasting.');
    console.error(e);
  }finally{
    if(msg) msg.style.display = 'none';
    inputEl.value = '';
  }
}

async function deletePhoto(key, url){
  if(!confirm('Slette dette bildet?')) return;
  await api(`/api/tasks/${encodeURIComponent(key)}/photos/delete`, {
    method: 'POST',
    body: JSON.stringify({ url })
  });
  load();
}

async function toggleSelfCleaned(key, checked){
  const row = document.getElementById(`payment-row-${key}`);
  if(row) row.style.display = checked ? 'none' : '';
  await api(`/api/tasks/${encodeURIComponent(key)}/payment`, {
    method: 'POST',
    body: JSON.stringify({ selfCleaned: checked })
  });
  load();
}

async function savePayment(key){
  const amountInput = document.getElementById(`amount-${key}`);
  const paidInput = document.getElementById(`paid-${key}`);
  const amount = amountInput ? Number(amountInput.value) : 400;
  const paid = paidInput ? paidInput.checked : false;
  await api(`/api/tasks/${encodeURIComponent(key)}/payment`, {
    method: 'POST',
    body: JSON.stringify({ amount, paid })
  });
  load();
}

async function load(){
  try{
    const dateISO = isoDateForOffset(dayOffset);
    const data = await api('/api/tasks?date=' + dateISO);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    let label = fmtDate(data.date);
    if(dayOffset === 0) label += ' (i dag)';
    document.getElementById('date-label').textContent = label;
    document.getElementById('count-badge').textContent = data.tasks.length + (data.tasks.length === 1 ? ' leilighet' : ' leiligheter');
    const list = document.getElementById('task-list');
    list.innerHTML = data.tasks.length
      ? data.tasks.map(renderTask).join("")
      : `<div class="empty">
           <span class="empty-icon">✓</span>
           <div class="empty-title">Ingenting i vente</div>
           <div class="empty-sub">Ingen leiligheter trenger rengjøring denne dagen.</div>
         </div>`;
  }catch(e){
    if(e.message !== "unauthorized") console.error(e);
  }
}

function isoMonthForOffset(offset){
  const d = new Date();
  d.setMonth(d.getMonth() + offset);
  return d.toISOString().slice(0, 7);
}

function fmtMonth(yearMonth){
  const [y, m] = yearMonth.split('-').map(Number);
  const d = new Date(y, m - 1, 1);
  return d.toLocaleDateString('nb-NO', { month: 'long', year: 'numeric' });
}

function showReport(){
  document.getElementById('task-list').style.display = 'none';
  document.getElementById('report-view').style.display = 'block';
  loadReport();
}

function hideReport(){
  document.getElementById('report-view').style.display = 'none';
  document.getElementById('task-list').style.display = 'block';
}

function changeReportMonth(delta){
  reportMonthOffset += delta;
  loadReport();
}

function renderReportEntry(e){
  let stamp;
  if(e.selfCleaned){
    stamp = `<div class="stamp self">Rengjort selv</div>`;
  } else if(e.paid){
    stamp = `<div class="stamp paid">Betalt · ${e.amount} kr</div>`;
  } else {
    stamp = `<div class="stamp unpaid">Ikke betalt · ${e.amount} kr</div>`;
  }
  const d = new Date(e.date + 'T00:00:00');
  const dateStr = d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
  return `
  <div class="report-entry">
    <div class="re-left">
      <div class="re-date">${dateStr}${e.done ? ' · rengjort' : ''}</div>
      <div class="re-name">${e.propertyName}</div>
    </div>
    ${stamp}
  </div>`;
}

async function loadReport(){
  const yearMonth = isoMonthForOffset(reportMonthOffset);
  document.getElementById('report-month-label').textContent = fmtMonth(yearMonth);
  const content = document.getElementById('report-content');
  content.innerHTML = `<div class="report-empty">Henter rapport …</div>`;

  try{
    const data = await api('/api/report?month=' + yearMonth);
    const t = data.totals;

    const summaryHtml = `
      <div class="report-summary">
        <div class="prop-name">Oppsummering</div>
        <div class="report-summary-grid">
          <div class="report-stat"><span class="num">${t.count}</span><span class="lbl">Rengjøringer totalt</span></div>
          <div class="report-stat paid"><span class="num">${t.totalPaidAmount} kr</span><span class="lbl">Betalt (${t.paidCount} stk)</span></div>
          <div class="report-stat unpaid"><span class="num">${t.totalUnpaidAmount} kr</span><span class="lbl">Ikke betalt (${t.unpaidCount} stk)</span></div>
          <div class="report-stat self"><span class="num">${t.selfCleanedCount}</span><span class="lbl">Rengjort selv</span></div>
        </div>
      </div>`;

    const entriesHtml = data.entries.length
      ? data.entries.map(renderReportEntry).join("")
      : `<div class="report-empty">Ingen rengjøringer denne måneden.</div>`;

    content.innerHTML = summaryHtml + entriesHtml;
  }catch(e){
    if(e.message !== "unauthorized"){
      content.innerHTML = `<div class="report-empty">Kunne ikke hente rapporten.</div>`;
      console.error(e);
    }
  }
}

if(localStorage.getItem(PW_KEY) !== null){
  load();
}

setInterval(() => {
  if(localStorage.getItem(PW_KEY) !== null && dayOffset === 0){
    load();
  }
}, 3 * 60 * 1000);
</script>
