<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rengjøring i dag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EF;
    --ink:#1E1C19;
    --ink-soft:#5B564D;
    --teal:#25616B;
    --teal-deep:#153C43;
    --amber:#E2A23B;
    --done:#5C7A4E;
    --line:#DCD6C8;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:80px;
  }
  header{
    background:var(--teal-deep);
    color:var(--paper);
    padding:22px 20px 26px;
    position:relative;
  }
  header h1{
    font-family:'Archivo Expanded', sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:0.02em;
    margin:0 0 4px;
    text-transform:uppercase;
  }
  .day-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:4px;
  }
  .day-nav button{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    color:var(--paper);
    font-size:12px;
    font-weight:600;
    padding:5px 10px;
    cursor:pointer;
    border-radius:3px;
  }
  .day-nav button:hover{background:rgba(255,255,255,0.22);}
  .day-nav .date{
    font-size:14px;
    color:#BFD9DC;
  }
  header .count{
    position:absolute;
    right:20px;
    top:20px;
    background:var(--amber);
    color:var(--teal-deep);
    font-weight:700;
    font-size:13px;
    padding:6px 12px;
    border-radius:999px;
  }

  #gate{
    max-width:340px;
    margin:80px auto;
    padding:24px;
    background:var(--card);
    border:1px solid var(--line);
    text-align:center;
  }
  #gate input{
    width:100%;
    padding:10px 12px;
    font-size:16px;
    border:1px solid var(--line);
    margin:12px 0;
  }
  #gate button, .refresh-btn{
    background:var(--teal);
    color:#fff;
    border:none;
    padding:10px 18px;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  #gate p.err{color:#B23A2F;font-size:13px;}

  main{max-width:640px;margin:0 auto;padding:18px 16px;}

  .task{
    background:var(--card);
    border:1px solid var(--line);
    margin-bottom:16px;
    position:relative;
    display:flex;
  }
  .stub{
    width:34px;
    flex:0 0 34px;
    background:repeating-linear-gradient(
      to bottom, var(--teal) 0 6px, transparent 6px 12px
    );
    background-color:var(--teal-deep);
    position:relative;
    border-right:2px dashed var(--paper);
  }
  .stub::before, .stub::after{
    content:"";
    position:absolute;
    left:50%;
    width:12px;height:12px;
    background:var(--paper);
    border-radius:50%;
    transform:translateX(-50%);
  }
  .stub::before{top:-6px;}
  .stub::after{bottom:-6px;}
  .task.done .stub{background-color:var(--done);}

  .task-body{padding:16px 16px 14px;flex:1;min-width:0;}

  .thumb{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
    border-radius:4px;
    margin-bottom:12px;
    background:var(--line);
  }

  .task-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .prop-name{
    font-family:'Archivo Expanded', sans-serif;
    font-weight:800;
    font-size:19px;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }
  .badge{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:3px;
    white-space:nowrap;
  }
  .badge.turnover{background:var(--amber);color:var(--teal-deep);}
  .badge.quiet{background:var(--line);color:var(--ink-soft);}

  .row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    padding:6px 0;
    border-top:1px solid var(--line);
  }
  .row:first-of-type{border-top:none;margin-top:8px;}
  .row .label{color:var(--ink-soft);}
  .row .value{font-weight:600;text-align:right;}

  .arrivals{margin-top:4px;}
  .arrival-line{
    font-size:13px;
    color:var(--teal-deep);
    background:#EAF2EE;
    padding:6px 8px;
    margin-top:6px;
    border-left:3px solid var(--teal);
  }

  .cleaner-line{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:10px;
  }

  .note-box{
    margin-top:12px;
  }
  .note-box label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
  }
  .note-box textarea{
    width:100%;
    min-height:60px;
    padding:8px 10px;
    font-family:inherit;
    font-size:14px;
    border:1px solid var(--line);
    resize:vertical;
    background:#FBFAF7;
  }
  .note-save-btn{
    margin-top:6px;
    background:var(--teal-deep);
    color:#fff;
    border:none;
    padding:7px 14px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .note-saved-msg{
    font-size:12px;
    color:var(--done);
    margin-left:8px;
    display:none;
  }

  .photo-section{margin-top:12px;}
  .photo-section .photo-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin-bottom:6px;
  }
  .photo-gallery{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:8px;
  }
  .photo-item{
    position:relative;
    display:inline-block;
  }
  .photo-thumb{
    width:64px;
    height:64px;
    object-fit:cover;
    border-radius:4px;
    border:1px solid var(--line);
    display:block;
  }
  .photo-delete-btn{
    position:absolute;
    top:-7px;
    right:-7px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#B23A2F;
    color:#fff;
    border:2px solid var(--card);
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .photo-upload-btn{
    display:inline-block;
    background:var(--teal-deep);
    color:#fff;
    border:none;
    padding:7px 14px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .photo-upload-input{display:none;}
  .photo-uploading-msg{
    font-size:12px;
