<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rengjøring i dag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F9;
    --card:#FFFFFF;
    --ink:#111827;
    --ink-soft:#6B7280;
    --teal:#0D9488;
    --teal-dark:#0F6B62;
    --teal-light:#E6F6F3;
    --green:#16A34A;
    --red:#DC2626;
    --gray-pill-bg:#E5E7EB;
    --gray-pill-ink:#4B5563;
    --amber:#D97706;
    --line:#E7E8EE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:90px;
    -webkit-font-smoothing:antialiased;
  }
  *:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(135deg, var(--teal-dark), #0A5049);
    color:#fff;
    padding:28px 20px 22px;
    border-radius:0 0 24px 24px;
    position:relative;
  }
  header h1{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:26px;
    margin:0 0 16px;
    letter-spacing:-0.01em;
  }
  .day-nav{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .day-nav button{
    background:rgba(255,255,255,0.14);
    border:none;
    color:#fff;
    font-family:'Manrope', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:9px 15px;
    cursor:pointer;
    border-radius:999px;
    transition:background 0.15s ease;
  }
  .day-nav button:hover{background:rgba(255,255,255,0.24);}
  .day-nav button.report-btn{
    background:var(--amber);
    color:#fff;
    margin-left:auto;
  }
  .day-nav button.report-btn:hover{filter:brightness(1.08);}
  .day-nav .date{
    font-size:14px;
    color:#CFEAE5;
    font-weight:500;
    padding:0 4px;
  }
  header .count{
    position:absolute;
    right:20px;
    top:26px;
    background:var(--amber);
    color:#fff;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:12px;
    padding:6px 13px;
    border-radius:999px;
  }

  /* ---------- Password gate ---------- */
  #gate{
    max-width:340px;
    margin:100px auto;
    padding:32px;
    background:var(--card);
    border-radius:20px;
    box-shadow:0 1px 2px rgba(17,24,39,0.04), 0 12px 32px rgba(17,24,39,0.08);
    text-align:center;
  }
  #gate p{font-family:'Manrope', sans-serif; font-size:15px; font-weight:700; color:var(--ink);}
  #gate input{
    width:100%;
    padding:12px 14px;
    font-size:16px;
    border:1px solid var(--line);
    border-radius:12px;
    margin:14px 0;
    font-family:inherit;
    background:#FAFAFC;
  }
  #gate button, .refresh-btn{
    background:var(--teal);
    color:#fff;
    border:none;
    padding:12px 22px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:'Manrope', sans-serif;
    border-radius:12px;
    transition:background 0.15s ease;
  }
  #gate button:hover, .refresh-btn:hover{background:var(--teal-dark);}
  #gate p.err{color:var(--red);font-size:13px;font-weight:400;}

  main{max-width:640px;margin:0 auto;padding:24px 16px 4px;}

  /* ---------- Task card ---------- */
  .task{
    background:var(--card);
    border-radius:18px;
    margin-bottom:20px;
    padding:22px;
    box-shadow:0 1px 2px rgba(17,24,39,0.03), 0 10px 28px rgba(17,24,39,0.06);
    border-top:4px solid var(--teal);
  }
  .task.done{border-top-color:var(--green);}

  .thumb{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
    border-radius:14px;
    margin-bottom:16px;
    background:var(--line);
  }

  .task-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .prop-name{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:-0.01em;
  }

  /* Signature element: solid status pill */
  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:12px;
    padding:6px 13px;
    border-radius:999px;
    color:#fff;
    white-space:nowrap;
    flex-shrink:0;
  }
  .pill.paid{background:var(--green);}
  .pill.unpaid{background:var(--red);}
  .pill.self{background:var(--gray-pill-bg); color:var(--gray-pill-ink);}

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:14px;
    padding:10px 0;
    border-top:1px solid var(--line);
    margin-top:8px;
  }
  .row .label{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .row .value{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:14px;
  }

  .arrivals{margin-top:8px;}
  .arrival-line{
    font-size:13px;
    color:var(--teal-dark);
    background:var(--teal-light);
    padding:9px 12px;
    margin-top:6px;
    border-radius:10px;
  }

  .cleaner-line{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:12px;
  }
  .cleaner-line b{color:var(--ink); font-weight:600;}

  .section{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  .section-label{
    font-family:'Manrope', sans-serif;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    display:block;
    margin-bottom:9px;
  }

  .note-box textarea{
    width:100%;
    min-height:64px;
    padding:11px 13px;
    font-family:'Inter', sans-serif;
    font-size:14px;
    border:1px solid var(--line);
    border-radius:12px;
    resize:vertical;
    background:#FAFAFC;
  }
  .soft-btn{
    margin-top:10px;
    background:var(--teal-light);
    color:var(--teal-dark);
    border:none;
    padding:9px 16px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    font-family:'Manrope', sans-serif;
    border-radius:10px;
    transition:background 0.15s ease;
  }
  .soft-btn:hover{background:#D3EEE8;}
  .note-saved-msg{
    font-size:12px;
    color:var(--green);
    margin-left:10px;
    display:none;
    font-weight:700;
    font-family:'Manrope', sans-serif;
  }

  .photo-gallery{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:10px;
  }
  .photo-item{position:relative; display:inline-block;}
  .photo-thumb{
    width:66px;
    height:66px;
    object-fit:cover;
    border-radius:12px;
    display:block;
  }
  .photo-delete-btn{
    position:absolute;
    top:-6px;
    right:-6px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--red);
    color:#fff;
    border:2px solid var(--card);
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .photo-btn-row{display:flex; gap:8px; flex-wrap:wrap;}

  .payment-checkbox{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    margin-bottom:11px;
    color:var(--ink);
  }
  .payment-checkbox input{width:17px;height:17px; accent-color:var(--teal);}
  .payment-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .payment-row input[type="number"]{
    width:88px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:14px;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    background:#FAFAFC;
  }

  .done-btn{
    margin-top:20px;
    width:100%;
    padding:14px;
    font-weight:700;
    font-size:14px;
    border:none;
    background:var(--teal);
    color:#fff;
    cursor:pointer;
    font-family:'Manrope', sans-serif;
    border-radius:14px;
    transition:background 0.15s ease;
  }
  .done-btn:hover{background:var(--teal-dark);}
  .task.done .done-btn{background:var(--green);}
  .task.done .done-btn:hover{filter:brightness(1.08);}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:56px 24px;
    background:var(--card);
    border-radius:18px;
    box-shadow:0 1px 2px rgba(17,24,39,0.03), 0 10px 28px rgba(17,24,39,0.06);
  }
  .empty .empty-icon{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--teal-light);
    color:var(--teal-dark);
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 14px;
  }
  .empty .empty-title{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:17px;
    color:var(--ink);
    margin-bottom:4px;
  }
  .empty .empty-sub{font-size:13px;}

  footer.bar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:13px 16px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
  }
  .auto-label{
    font-size:12px;
    color:var(--ink-soft);
  }

  /* ---------- Report view ---------- */
  #report-view .day-nav{
    background:var(--teal-dark);
    padding:14px 18px;
    border-radius:16px;
    margin-bottom:20px;
  }
  .report-summary{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 1px 2px rgba(17,24,39,0.03), 0 10px 28px rgba(17,24,39,0.06);
  }
  .report-summary .prop-name{margin-bottom:4px;}
  .report-summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:12px;
  }
  .report-stat{
    background:var(--bg);
    padding:14px 16px;
    border-radius:12px;
    border-top:3px solid var(--teal);
  }
  .report-stat.paid{border-top-color:var(--green);}
  .report-stat.unpaid{border-top-color:var(--red);}
  .report-stat.self{border-top-color:var(--gray-pill-bg);}
  .report-stat .num{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:19px;
    display:block;
  }
  .report-stat .lbl{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .report-entry{
    background:var(--card);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    box-shadow:0 1px 2px rgba(17,24,39,0.03), 0 4px 14px rgba(17,24,39,0.04);
  }
  .report-entry .re-left{min-width:0;}
  .report-entry .re-date{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .report-entry .re-name{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:15px;
    margin-top:2px;
  }
  .report-empty{
    text-align:center;
    color:var(--ink-soft);
    padding:48px 20px;
    font-size:13px;
  }
</style>
</head>
<body>

<div id="gate">
  <p>Skriv inn passord</p>
  <input type="password" id="pw" placeholder="Passord" />
  <button onclick="unlock()">Lås opp</button>
  <p class="err" id="gate-err"></p>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="count" id="count-badge">–</div>
    <h1>Rengjøring</h1>
    <div class="day-nav">
      <button onclick="changeDay(-1)">‹ Forrige</button>
      <span class="date" id="date-label"></span>
      <button onclick="changeDay(1)">Neste ›</button>
      <button onclick="goToday()">I dag</button>
      <button class="report-btn" onclick="showReport()">Rapport</button>
    </div>
  </header>
  <main id="task-list"></main>

  <main id="report-view" style="display:none;">
    <div class="day-nav">
      <button onclick="changeReportMonth(-1)">‹ Forrige måned</button>
      <span class="date" id="report-month-label"></span>
      <button onclick="changeReportMonth(1)">Neste måned ›</button>
      <button onclick="hideReport()" style="margin-left:auto;">← Tilbake</button>
    </div>
    <div id="report-content"></div>
  </main>

  <footer class="bar">
    <button class="refresh-btn" onclick="load()">Oppdater</button>
    <span class="auto-label">Auto · hvert 3. min</span>
  </footer>
</div>

<script>
const PW_KEY = "rengjoring_pw";
let dayOffset = 0;
let reportMonthOffset = 0;

const CLOUDINARY_CLOUD_NAME = "silizk68";
const CLOUDINARY_UPLOAD_PRESET = "Rengjoring-bilder";

function unlock(){
  const pw = document.getElementById('pw').value;
  localStorage.setItem(PW_KEY, pw);
  load();
}

async function api(path, opts={}){
  const pw = localStorage.getItem(PW_KEY) || "";
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "x-dashboard-password": pw, ...(opts.headers||{}) }
  });
  if(res.status === 401){
    document.getElementById('gate').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate-err').textContent = "Feil passord.";
    throw new Error("unauthorized");
  }
  return res.json();
}

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('nb-NO', { weekday:'long', day:'numeric', month:'long' });
}

function isoDateForOffset(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function changeDay(delta){
  dayOffset += delta;
  load();
}

function goToday(){
  dayOffset = 0;
  load();
}

function renderTask(t){
  const hasArrival = t.nextArrivals && t.nextArrivals.length > 0;
  const arrivalsHtml = hasArrival
    ? t.nextArrivals.map(a => `
        <div class="arrival-line">
          Nye gjester inn ${a.checkinTime ? "kl " + a.checkinTime : "samme dag"} — ${a.guests} gjester
        </div>`).join("")
    : `<div class="arrival-line" style="background:#F1F2F6;color:var(--ink-soft);">Ingen innsjekk samme dag</div>`;

  const thumbHtml = t.imageUrl
    ? `<img class="thumb" src="${t.imageUrl}" alt="${t.propertyName}" />`
    : "";

  const photos = t.photos || [];
  const galleryHtml = photos.map(url => `
    <div class="photo-item">
      <a href="${url}" target="_blank"><img class="photo-thumb" src="${url}" /></a>
      <button class="photo-delete-btn" onclick="deletePhoto('${t.key}', '${url.replace(/'/g, "\\'")}')" title="Slett bilde">×</button>
    </div>`).join("");

  let paymentPill;
  if(t.selfCleaned){
    paymentPill = `<div class="pill self">Rengjort selv</div>`;
  } else if(t.paid){
    paymentPill = `<div class="pill paid">Betalt · ${t.amount} kr</div>`;
  } else {
    paymentPill = `<div class="pill unpaid">Ikke betalt</div>`;
  }

  return `
  <div class="task ${t.done ? 'done' : ''}" id="task-${t.key}">
    ${thumbHtml}
    <div class="task-top">
      <div class="prop-name">${t.propertyName}</div>
      ${paymentPill}
    </div>
    <div class="row">
      <span class="label">Utsjekk</span>
      <span class="value">${t.checkoutTime ? t.checkoutTime.slice(0,5) : 'Ukjent'}</span>
    </div>
    <div class="arrivals">${arrivalsHtml}</div>
    <div class="cleaner-line">Ansvarlig: <b>${t.cleaner.name || 'Ikke satt'}</b></div>

    <div class="section note-box">
      <label class="section-label" for="note-${t.key}">Beskjeder</label>
      <textarea id="note-${t.key}" placeholder="F.eks. tidlig innsjekk, sen utsjekk, når leiligheten er klar...">${t.note || ""}</textarea>
      <button class="soft-btn" onclick="saveNote('${t.key}')">Lagre beskjed</button>
      <span class="note-saved-msg" id="saved-${t.key}">Lagret ✓</span>
    </div>

    <div class="section photo-section">
      <label class="section-label">Bilder — skader, glemte ting o.l.</label>
      <div class="photo-gallery">${galleryHtml}</div>
      <div class="photo-btn-row">
        <label class="soft-btn" style="margin-top:0; display:inline-block;">
          📷 Ta bilde
          <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="uploadPhoto('${t.key}', this)" />
        </label>
        <label class="soft-btn" style="margin-top:0; display:inline-block;">
          🖼️ Velg fra galleri
          <input type="file" accept="image/*" style="display:none;" onchange="uploadPhoto('${t.key}', this)" />
        </label>
      </div>
      <span class="note-saved-msg" id="uploading-${t.key}" style="display:none; color:var(--ink-soft);">Laster opp …</span>
    </div>

    <div class="section payment-box">
      <label class="section-label">Betaling</label>
      <label class="payment-checkbox">
        <input type="checkbox" id="self-${t.key}" ${t.selfCleaned ? 'checked' : ''} onchange="toggleSelfCleaned('${t.key}', this.checked)" />
        Rengjort selv (ingen betaling)
      </label>
      <div class="payment-row" id="payment-row-${t.key}" style="${t.selfCleaned ? 'display:none;' : ''}">
        <input type="number" id="amount-${t.key}" value="${t.amount}" min="0" step="10" />
        <label class="payment-checkbox" style="margin-bottom:0;">
          <input type="checkbox" id="paid-${t.key}" ${t.paid ? 'checked' : ''} />
          Betalt
        </label>
        <button class="soft-btn" style="margin-top:0;" onclick="savePayment('${t.key}')">Lagre</button>
      </div>
    </div>

    <button class="done-btn" onclick="toggleDone('${t.key}', ${!t.done})">
      ${t.done ? '✓ Rengjort' : 'Merk som rengjort'}
    </button>
  </div>`;
}

async function toggleDone(key, done){
  await api(`/api/tasks/${encodeURIComponent(key)}/done`, {
    method: 'POST',
    body: JSON.stringify({ done })
  });
  load();
}

async function saveNote(key){
  const textarea = document.getElementById(`note-${key}`);
  const note = textarea ? textarea.value : "";
  await api(`/api/tasks/${encodeURIComponent(key)}/note`, {
    method: 'POST',
    body: JSON.stringify({ note })
  });
  const msg = document.getElementById(`saved-${key}`);
  if(msg){
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 2000);
  }
}

async function uploadPhoto(key, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const msg = document.getElementById(`uploading-${key}`);
  if(msg) msg.style.display = 'inline';

  try{
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

    const uploadRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: 'POST',
      body: formData
    });
    const uploadData = await uploadRes.json();

    if(!uploadData.secure_url){
      alert('Kunne ikke laste opp bildet. Prøv igjen.');
      return;
    }

    await api(`/api/tasks/${encodeURIComponent(key)}/photos`, {
      method: 'POST',
      body: JSON.stringify({ url: uploadData.secure_url })
    });

    load();
  }catch(e){
    alert('Noe gikk galt under opplasting.');
    console.error(e);
  }finally{
    if(msg) msg.style.display = 'none';
    inputEl.value = '';
  }
}

async function deletePhoto(key, url){
  if(!confirm('Slette dette bildet?')) return;
  await api(`/api/tasks/${encodeURIComponent(key)}/photos/delete`, {
    method: 'POST',
    body: JSON.stringify({ url })
  });
  load();
}

async function toggleSelfCleaned(key, checked){
  const row = document.getElementById(`payment-row-${key}`);
  if(row) row.style.display = checked ? 'none' : '';
  await api(`/api/tasks/${encodeURIComponent(key)}/payment`, {
    method: 'POST',
    body: JSON.stringify({ selfCleaned: checked })
  });
  load();
}

async function savePayment(key){
  const amountInput = document.getElementById(`amount-${key}`);
  const paidInput = document.getElementById(`paid-${key}`);
  const amount = amountInput ? Number(amountInput.value) : 400;
  const paid = paidInput ? paidInput.checked : false;
  await api(`/api/tasks/${encodeURIComponent(key)}/payment`, {
    method: 'POST',
    body: JSON.stringify({ amount, paid })
  });
  load();
}

async function load(){
  try{
    const dateISO = isoDateForOffset(dayOffset);
    const data = await api('/api/tasks?date=' + dateISO);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    let label = fmtDate(data.date);
    if(dayOffset === 0) label += ' (i dag)';
    document.getElementById('date-label').textContent = label;
    document.getElementById('count-badge').textContent = data.tasks.length + (data.tasks.length === 1 ? ' leilighet' : ' leiligheter');
    const list = document.getElementById('task-list');
    list.innerHTML = data.tasks.length
      ? data.tasks.map(renderTask).join("")
      : `<div class="empty">
           <div class="empty-icon">✓</div>
           <div class="empty-title">Ingenting i vente</div>
           <div class="empty-sub">Ingen leiligheter trenger rengjøring denne dagen.</div>
         </div>`;
  }catch(e){
    if(e.message !== "unauthorized") console.error(e);
  }
}

function isoMonthForOffset(offset){
  const d = new Date();
  d.setMonth(d.getMonth() + offset);
  return d.toISOString().slice(0, 7);
}

function fmtMonth(yearMonth){
  const [y, m] = yearMonth.split('-').map(Number);
  const d = new Date(y, m - 1, 1);
  return d.toLocaleDateString('nb-NO', { month: 'long', year: 'numeric' });
}

function showReport(){
  document.getElementById('task-list').style.display = 'none';
  document.getElementById('report-view').style.display = 'block';
  loadReport();
}

function hideReport(){
  document.getElementById('report-view').style.display = 'none';
  document.getElementById('task-list').style.display = 'block';
}

function changeReportMonth(delta){
  reportMonthOffset += delta;
  loadReport();
}

function renderReportEntry(e){
  let pill;
  if(e.selfCleaned){
    pill = `<div class="pill self">Rengjort selv</div>`;
  } else if(e.paid){
    pill = `<div class="pill paid">Betalt · ${e.amount} kr</div>`;
  } else {
    pill = `<div class="pill unpaid">Ikke betalt · ${e.amount} kr</div>`;
  }
  const d = new Date(e.date + 'T00:00:00');
  const dateStr = d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
  return `
  <div class="report-entry">
    <div class="re-left">
      <div class="re-date">${dateStr}${e.done ? ' · rengjort' : ''}</div>
      <div class="re-name">${e.propertyName}</div>
    </div>
    ${pill}
  </div>`;
}

async function loadReport(){
  const yearMonth = isoMonthForOffset(reportMonthOffset);
  document.getElementById('report-month-label').textContent = fmtMonth(yearMonth);
  const content = document.getElementById('report-content');
  content.innerHTML = `<div class="report-empty">Henter rapport …</div>`;

  try{
    const data = await api('/api/report?month=' + yearMonth);
    const t = data.totals;

    const summaryHtml = `
      <div class="report-summary">
        <div class="prop-name">Oppsummering</div>
        <div class="report-summary-grid">
          <div class="report-stat"><span class="num">${t.count}</span><span class="lbl">Rengjøringer totalt</span></div>
          <div class="report-stat paid"><span class="num">${t.totalPaidAmount} kr</span><span class="lbl">Betalt (${t.paidCount} stk)</span></div>
          <div class="report-stat unpaid"><span class="num">${t.totalUnpaidAmount} kr</span><span class="lbl">Ikke betalt (${t.unpaidCount} stk)</span></div>
          <div class="report-stat self"><span class="num">${t.selfCleanedCount}</span><span class="lbl">Rengjort selv</span></div>
        </div>
      </div>`;

    const entriesHtml = data.entries.length
      ? data.entries.map(renderReportEntry).join("")
      : `<div class="report-empty">Ingen rengjøringer denne måneden.</div>`;

    content.innerHTML = summaryHtml + entriesHtml;
  }catch(e){
    if(e.message !== "unauthorized"){
      content.innerHTML = `<div class="report-empty">Kunne ikke hente rapporten.</div>`;
      console.error(e);
    }
  }
}

if(localStorage.getItem(PW_KEY) !== null){
  load();
}

setInterval(() => {
  if(localStorage.getItem(PW_KEY) !== null && dayOffset === 0){
    load();
  }
}, 3 * 60 * 1000);
</script>

</html>
